services:
  - type: web
    name: eduguard-ai-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm run deploy:start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_DIALECT
        value: postgres
      - key: DATABASE_URL
        sync: false          # Set this manually in Render dashboard — Neon PostgreSQL URL
      - key: FRONTEND_URL
        sync: false          # Set this to your Vercel frontend URL after deploying
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: RATE_LIMIT_WINDOW
        value: "15"
      - key: RATE_LIMIT_MAX
        value: "200"
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USER
        sync: false          # Optional — set to enable email alerts
      - key: EMAIL_PASS
        sync: false          # Optional — set to enable email alerts

